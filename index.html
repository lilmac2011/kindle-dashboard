<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Home</title>
<style>
/* Written for the Kindle's old browser engine: ES5 JS, absolute positioning, no grid. */
@font-face { font-family: "Inter"; font-weight: 400; src: url("fonts/Inter-Regular.otf"); }
@font-face { font-family: "Inter"; font-weight: 500; src: url("fonts/Inter-Medium.otf"); }
@font-face { font-family: "Inter"; font-weight: 600; src: url("fonts/Inter-SemiBold.otf"); }
@font-face { font-family: "Inter"; font-weight: 700; src: url("fonts/Inter-Bold.otf"); }
html, body { margin: 0; padding: 0; background: #fff; overflow: hidden; height: 100%; }
body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; color: #000; -webkit-user-select: none; }
#app { position: absolute; left: 0; top: 0; width: 1648px; height: 1236px; background: #fff;
  -webkit-transform-origin: 0 0; transform-origin: 0 0; }

.box { position: absolute; border: 4px solid #000; border-radius: 18px; overflow: hidden; background: #fff; }
.bar { background: #000; color: #fff; height: 58px; line-height: 58px; padding: 0 26px;
  font-weight: 700; font-size: 28px; letter-spacing: 1px; text-transform: uppercase; }
.bar .r { float: right; font-weight: 500; font-size: 25px; letter-spacing: 0; text-transform: none; color: #d0d0d0; }
.body { position: absolute; left: 26px; right: 26px; top: 80px; bottom: 20px; overflow: hidden; }
.tapme { position: absolute; right: 22px; bottom: 14px; font-size: 21px; color: #888; }
.muted { color: #6e6e6e; }
.small { font-size: 23px; }
.row { position: relative; border-bottom: 1px solid #ddd; }
.row:last-child { border-bottom: 0; }
.clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-block; font-size: 19px; font-weight: 700; padding: 1px 8px; border: 2px solid #000;
  border-radius: 6px; margin-right: 10px; vertical-align: 2px; }
.tag.inv { background: #000; color: #fff; }
.done .ttl { text-decoration: line-through; color: #888; }
.pend { font-size: 19px; font-weight: 600; border: 2px dashed #000; border-radius: 6px; padding: 0 6px; margin-left: 8px; }

/* weather */
.big { font-size: 112px; font-weight: 700; line-height: 1; }
.cell { position: absolute; }
.cell .k { font-size: 23px; color: #6e6e6e; }
.cell .v { font-size: 30px; font-weight: 600; }

/* detail overlay */
#detail { display: none; position: absolute; left: 0; top: 0; width: 1648px; height: 1236px; background: #fff; }
#detail .head { position: absolute; left: 0; right: 0; top: 0; height: 96px; background: #000; color: #fff; }
#detail .head h1 { margin: 0; font-size: 40px; line-height: 96px; padding-left: 40px; font-weight: 700; }
#detail .close { position: absolute; right: 24px; top: 16px; height: 64px; line-height: 64px; padding: 0 30px;
  border: 3px solid #fff; border-radius: 12px; font-size: 30px; font-weight: 600; }
#dlist { position: absolute; left: 40px; right: 40px; top: 120px; bottom: 150px; overflow-y: auto; }
#dfoot { position: absolute; left: 40px; right: 40px; bottom: 24px; height: 110px; }
.item { border: 3px solid #000; border-radius: 14px; padding: 18px 22px; margin-bottom: 18px; }
.item .ttl { font-size: 32px; font-weight: 600; }
.item .sub { font-size: 25px; color: #555; margin-top: 4px; }
.item .snip { font-size: 25px; color: #222; margin-top: 10px; line-height: 1.35; }
.acts { margin-top: 14px; }
.btn { display: inline-block; height: 60px; line-height: 56px; padding: 0 26px; border: 3px solid #000;
  border-radius: 12px; font-size: 27px; font-weight: 600; margin-right: 12px; background: #fff; }
.btn.on { background: #000; color: #fff; }
.inrow { margin-top: 14px; display: none; }
.inrow input, #dfoot input { font-family: inherit; font-size: 28px; height: 64px; border: 3px solid #000;
  border-radius: 12px; padding: 0 18px; width: 1150px; vertical-align: middle; -webkit-appearance: none; }
#dfoot input { width: 1300px; }
.inrow .btn, #dfoot .btn { vertical-align: middle; }
.note { font-size: 23px; color: #444; margin-top: 10px; }
#toast { display: none; position: absolute; left: 50%; bottom: 40px; width: 760px; margin-left: -380px;
  background: #000; color: #fff; text-align: center; font-size: 28px; padding: 18px; border-radius: 14px; }
#foot { position: absolute; right: 30px; bottom: 6px; font-size: 21px; color: #777; }
</style>
</head>
<body>
<div id="app">
  <div class="box" id="b-today" style="left:24px; top:24px; width:780px; height:560px;">
    <div class="bar">Today<span class="r">more ›</span></div><div class="body" id="today"></div>
  </div>
  <div class="box" id="b-sched" style="left:836px; top:24px; width:780px; height:560px;">
    <div class="bar">Schedule<span class="r" id="schedR"></span></div><div class="body" id="sched"></div>
  </div>
  <div class="box" id="b-todo" style="left:24px; top:614px; width:780px; height:572px;">
    <div class="bar">To-do &amp; homework<span class="r" id="todoR"></span></div><div class="body" id="todo"></div>
  </div>
  <div class="box" id="b-mail" style="left:836px; top:614px; width:780px; height:572px;">
    <div class="bar">Important email<span class="r" id="mailR"></span></div><div class="body" id="mail"></div>
  </div>
  <div id="foot"></div>

  <div id="detail">
    <div class="head"><h1 id="dtitle"></h1><div class="close" id="dclose">Done ✕</div></div>
    <div id="dlist"></div>
    <div id="dfoot">
      <input id="dnote" type="text" placeholder="Quick note for Claude about this box…">
      <span class="btn" id="dsend">Send</span>
    </div>
  </div>
  <div id="toast"></div>
  <div id="login" style="display:none;position:absolute;left:0;top:0;width:1648px;height:1236px;background:#fff;text-align:center">
    <div style="font-size:56px;font-weight:700;margin-top:300px">Hi Finn</div>
    <div style="font-size:32px;color:#444;margin:20px 0 40px">Type the 8-letter code from your Google script once, and this Kindle will remember it.</div>
    <input id="code" type="text" autocapitalize="off" autocorrect="off" style="font-family:inherit;font-size:48px;height:90px;width:420px;text-align:center;border:4px solid #000;border-radius:14px;letter-spacing:6px">
    <span class="btn on" id="go" style="height:90px;line-height:86px;font-size:36px;vertical-align:middle;margin-left:16px">Start</span>
    <div id="loginmsg" style="font-size:28px;margin-top:30px;color:#444"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  var W = 1648, H = 1236;
  var LAT = 34.448, LON = -119.243;
  var REFRESH_MS = 15 * 60 * 1000;

  // ---------- config (backend URL + key come from the page address after #) ----------
  var cfg = {};
  function readCfg() {
    var h = (location.hash || "").replace(/^#/, "").split("&"), i, kv;
    for (i = 0; i < h.length; i++) { kv = h[i].split("="); if (kv[0]) cfg[kv[0]] = decodeURIComponent(kv[1] || ""); }
    try {
      if (cfg.api) { localStorage.setItem("dash_api", cfg.api); localStorage.setItem("dash_key", cfg.key || ""); }
      cfg.api = cfg.api || localStorage.getItem("dash_api") || window.DASH_API;
      cfg.key = cfg.key || localStorage.getItem("dash_key");
    } catch (e) {}
  }
  readCfg();

  // ---------- tiny helpers ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function xhr(method, url, body, cb) {
    var r = new XMLHttpRequest();
    r.open(method, url, true);
    if (body) r.setRequestHeader("Content-Type", "text/plain;charset=utf-8");
    r.onreadystatechange = function () {
      if (r.readyState !== 4) return;
      if (r.status >= 200 && r.status < 300) { try { cb(null, JSON.parse(r.responseText)); } catch (e) { cb(e); } }
      else cb(new Error("HTTP " + r.status));
    };
    r.send(body || null);
  }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  function toast(msg) { var t = $("toast"); t.innerHTML = esc(msg); t.style.display = "block"; setTimeout(function () { t.style.display = "none"; }, 2600); }
  function tap(el, fn) { el.onclick = function (e) { if (e && e.stopPropagation) e.stopPropagation(); fn(e); }; }
  function hm(d) { var h = d.getHours(), m = d.getMinutes(); var ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + (m < 10 ? "0" : "") + m + " " + ap; }
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  // ---------- fit + landscape ----------
  function fit() {
    var app = $("app"), vw = window.innerWidth, vh = window.innerHeight, rot = vh > vw, s, t;
    if (rot) { s = Math.min(vh / W, vw / H); t = "translate(" + vw + "px,0) rotate(90deg) scale(" + s + ")"; }
    else { s = Math.min(vw / W, vh / H); t = "scale(" + s + ")"; }
    app.style.webkitTransform = t; app.style.transform = t;
  }

  // ---------- state ----------
  var data = store("dash_data") || SAMPLE();
  var weather = store("dash_weather");
  var pending = store("dash_pending") || [];   // actions waiting for Claude's next check-in
  var open = null;

  function pendFor(itemId) { var out = {}, i; for (i = 0; i < pending.length; i++) if (pending[i].itemId === itemId) out[pending[i].action] = pending[i]; return out; }
  function prune() {
    var h = {}, i, keep = [];
    var handled = data.handled || [];
    for (i = 0; i < handled.length; i++) h[handled[i]] = 1;
    for (i = 0; i < pending.length; i++) if (!h[pending[i].id]) keep.push(pending[i]);
    pending = keep; store("dash_pending", pending);
  }
  function hidden(p) { return p.forget || p.clear || p.done; }

  function act(box, item, action, text) {
    var a = { id: "a" + new Date().getTime() + Math.floor(Math.random() * 1000), at: new Date().toISOString(),
      box: box, itemId: item ? item.id : null, item: item ? (item.title || item.text || item.subject) : null,
      from: item && item.from ? item.from : undefined, action: action, text: text || "" };
    // tapping the same toggle again cancels it
    for (var i = 0; i < pending.length; i++) {
      if (item && pending[i].itemId === item.id && pending[i].action === action && action !== "respond" && action !== "note") {
        a.action = "undo-" + action; a.undoes = pending[i].id; pending.splice(i, 1); store("dash_pending", pending); send(a); return false;
      }
    }
    pending.push(a); store("dash_pending", pending); send(a); return true;
  }
  function send(a) {
    if (!cfg.api) return;
    xhr("POST", cfg.api, JSON.stringify({ key: cfg.key, op: "action", action: a }), function (err) { if (err) toast("Saved here, will retry sending"); });
  }
  function resend() { for (var i = 0; i < pending.length; i++) if (!pending[i].sent) send(pending[i]); }

  // ---------- main view ----------
  function wIcon(code, size) {
    var s = size, sun = '<circle cx="32" cy="32" r="11" fill="none" stroke="#000" stroke-width="4"/>' +
      '<g stroke="#000" stroke-width="4"><line x1="32" y1="6" x2="32" y2="14"/><line x1="32" y1="50" x2="32" y2="58"/><line x1="6" y1="32" x2="14" y2="32"/><line x1="50" y1="32" x2="58" y2="32"/><line x1="13" y1="13" x2="19" y2="19"/><line x1="45" y1="45" x2="51" y2="51"/><line x1="13" y1="51" x2="19" y2="45"/><line x1="45" y1="19" x2="51" y2="13"/></g>';
    var cloud = '<path d="M18 50 h30 a10 10 0 0 0 0-20 a14 14 0 0 0-27-3 a10 10 0 0 0-3 23z" fill="#fff" stroke="#000" stroke-width="4"/>';
    var rain = '<g stroke="#000" stroke-width="4"><line x1="22" y1="54" x2="19" y2="62"/><line x1="33" y1="54" x2="30" y2="62"/><line x1="44" y1="54" x2="41" y2="62"/></g>';
    var inner = code <= 1 ? sun : code === 2 ? '<g transform="translate(10,-8) scale(.75)">' + sun + '</g>' + cloud : code === 45 || code === 48 ?
      '<g stroke="#000" stroke-width="4"><line x1="10" y1="24" x2="54" y2="24"/><line x1="10" y1="34" x2="54" y2="34"/><line x1="10" y1="44" x2="54" y2="44"/></g>' :
      '<g transform="translate(0,-6)">' + cloud + '</g>' + (code >= 51 ? rain : "");
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 64 64">' + inner + '</svg>';
  }
  var WMO = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Fog",51:"Drizzle",53:"Drizzle",55:"Drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",80:"Showers",81:"Showers",82:"Heavy showers",95:"Thunderstorm"};
  function r(n) { return Math.round(n); }
  function t12(iso) { var d = new Date(iso.replace("T", " ").replace(/-/g, "/")); return hm(d).replace(":00 ", " ").replace(" ", "").toLowerCase(); }

  function drawToday() {
    var now = new Date(), h = "";
    h += '<div style="font-size:64px;font-weight:700;line-height:1">' + DAYS[now.getDay()] + '</div>';
    h += '<div style="font-size:32px;font-weight:500;color:#333;margin-top:8px">' + MONTHS[now.getMonth()] + " " + now.getDate() + ", " + now.getFullYear() + '</div>';
    var w = weather;
    if (!w || !w.current) { $("today").innerHTML = h + '<div class="muted" style="margin-top:40px;font-size:28px">Loading weather…</div>'; return; }
    var c = w.current, d = w.daily;
    h += '<div style="position:absolute;right:0;top:0;text-align:right">' +
      '<div style="display:inline-block;vertical-align:top;margin-right:10px">' + wIcon(c.weather_code, 96) + '</div>' +
      '<div class="big" style="display:inline-block">' + r(c.temperature_2m) + '°</div>' +
      '<div style="font-size:28px;font-weight:600">' + (WMO[c.weather_code] || "") + ' · H ' + r(d.temperature_2m_max[0]) + '° L ' + r(d.temperature_2m_min[0]) + '°</div></div>';
    var cells = [["Feels like", r(c.apparent_temperature) + "°"], ["Rain", (d.precipitation_probability_max[0] || 0) + "%"],
      ["Wind", r(c.wind_speed_10m) + " mph"], ["Humidity", r(c.relative_humidity_2m) + "%"],
      ["Sunrise", t12(d.sunrise[0])], ["Sunset", t12(d.sunset[0])]];
    h += '<div style="position:absolute;left:0;right:0;top:170px;height:2px;background:#bbb"></div>';
    for (var i = 0; i < cells.length; i++)
      h += '<div class="cell" style="left:' + (i * 121) + 'px;top:190px"><div class="k">' + cells[i][0] + '</div><div class="v">' + cells[i][1] + '</div></div>';
    h += '<div style="position:absolute;left:0;right:0;top:282px;height:2px;background:#bbb"></div>';
    // next hours
    var hr = w.hourly, start = 0, nowMs = now.getTime() - 3600000, k;
    for (k = 0; k < hr.time.length; k++) if (new Date(hr.time[k].replace("T", " ").replace(/-/g, "/")).getTime() >= nowMs) { start = k; break; }
    for (k = 0; k < 8; k++) {
      var j = start + k * 2; if (j >= hr.time.length) break;
      var p = hr.precipitation_probability[j] || 0;
      h += '<div class="cell" style="left:' + (k * 91) + 'px;top:300px;width:84px;text-align:center">' +
        '<div class="small muted">' + t12(hr.time[j]) + '</div>' + wIcon(hr.weather_code[j], 44) +
        '<div style="font-size:28px;font-weight:600">' + r(hr.temperature_2m[j]) + '°</div>' +
        '<div class="small muted">' + (p >= 20 ? p + "%" : "&nbsp;") + '</div></div>';
    }
    $("today").innerHTML = h;
  }

  function schedRow(it, big) {
    var cls = it.kind === "class";
    var ttl = (cls && it.period ? "P" + it.period + " · " : "") + it.title;
    var sub = [it.where, it.calendar].filter ? [it.where, it.calendar].filter(function (x) { return x; }).join(" · ") : "";
    return '<div style="position:absolute;left:0;top:2px;width:96px"><div style="font-size:' + (big ? 30 : 27) + 'px;font-weight:600">' + esc(it.start) + '</div>' +
      (it.end ? '<div class="small muted">' + esc(it.end) + '</div>' : '') + '</div>' +
      '<div style="margin-left:104px"><span style="display:inline-block;width:14px;height:14px;margin-right:12px;vertical-align:3px;' +
      (cls ? 'background:#000' : 'border:3px solid #000;border-radius:50%;width:10px;height:10px') + '"></span>' +
      '<span class="ttl" style="font-size:' + (big ? 32 : 29) + 'px;font-weight:' + (cls ? 600 : 500) + '">' + esc(ttl) + '</span>' +
      (sub ? '<div class="small muted clip" style="margin-left:26px">' + esc(sub) + '</div>' : '') + '</div>';
  }
  function schedLine(it) {
    var cls = it.kind === "class";
    var ttl = (cls && it.period ? "P" + it.period + " · " : "") + it.title;
    var right = it.where || it.calendar || "";
    return '<span style="display:inline-block;width:178px;font-size:26px;font-weight:600">' + esc(it.start) +
      (it.end ? '<span class="muted" style="font-weight:400">–' + esc(it.end) + '</span>' : '') + '</span>' +
      '<span style="display:inline-block;width:14px;height:14px;margin-right:12px;vertical-align:2px;' +
      (cls ? 'background:#000' : 'border:3px solid #000;border-radius:50%;width:10px;height:10px') + '"></span>' +
      '<span class="ttl" style="font-size:28px;font-weight:' + (cls ? 600 : 500) + '">' + esc(ttl) + '</span>' +
      '<span class="small muted" style="position:absolute;right:0;top:12px">' + esc(right) + '</span>';
  }
  function drawSched() {
    var items = data.schedule || [], h = "", n = 0, shown = 0, i;
    for (i = 0; i < items.length; i++) {
      var p = pendFor(items[i].id); if (items[i].kind === "class") n++;
      if (hidden(p)) continue;
      if (shown >= 8) { h += '<div class="small muted" style="padding-top:6px">+ ' + (items.length - i) + ' more, tap to see</div>'; break; }
      h += '<div class="row" style="padding:9px 0 9px">' + schedLine(items[i]) + '</div>'; shown++;
    }
    $("sched").innerHTML = h || '<div class="muted" style="font-size:28px">' + esc(data.schedule_note || "Nothing scheduled today") + '</div>';
    $("schedR").innerHTML = (n ? n + " classes  " : "") + "›";
  }

  function todoRow(it, p) {
    var hw = it.type === "homework", tag = it.missing ? '<span class="tag inv">MISSING</span>' : it.due ? '<span class="tag">' + esc(it.due.toUpperCase()) + '</span>' : "";
    var sub = hw ? it["class"] : it.why;
    return '<div class="' + (p.done ? "done" : "") + '"><span style="display:inline-block;width:30px;height:30px;border:3px solid #000;border-radius:6px;vertical-align:-6px;margin-right:16px;text-align:center;font-size:26px;line-height:28px">' +
      (p.done ? "✓" : "") + '</span><span class="ttl" style="font-size:29px;font-weight:500">' + esc(it.text) + '</span>' +
      (p.important ? '<span class="pend">★</span>' : "") +
      ((tag || sub) ? '<div style="margin:4px 0 0 49px" class="small">' + tag + '<span class="muted">' + esc(sub || "") + '</span></div>' : "") + '</div>';
  }
  function drawTodo() {
    var items = data.todos || [], h = "", miss = 0, shown = 0, i;
    for (i = 0; i < items.length; i++) {
      var p = pendFor(items[i].id); if (items[i].missing && !p.done) miss++;
      if (p.forget) continue;
      if (shown >= 7) { h += '<div class="small muted">+ more</div>'; break; }
      h += '<div class="row" style="padding:8px 0 10px">' + todoRow(items[i], p) + '</div>'; shown++;
    }
    $("todo").innerHTML = h || '<div class="muted" style="font-size:28px">All clear</div>';
    $("todoR").innerHTML = (miss ? miss + " missing  " : "") + "›";
  }

  function drawMail() {
    var items = data.emails || [], h = "", n = 0, i;
    for (i = 0; i < items.length && n < 5; i++) {
      var m = items[i], p = pendFor(m.id); if (p.forget) continue; n++;
      var status = p.respond ? '<span class="pend">reply queued</span>' : p.important ? '<span class="pend">★ important</span>' : "";
      h += '<div class="row" style="padding:8px 0 10px 50px">' +
        '<div style="position:absolute;left:0;top:10px;width:34px;height:34px;border-radius:17px;background:#000;color:#fff;text-align:center;font-weight:700;font-size:21px;line-height:34px">' + n + '</div>' +
        '<div class="clip" style="font-size:27px;font-weight:700;padding-right:110px">' + esc(m.from) + status + '</div>' +
        '<div class="small muted" style="position:absolute;right:0;top:10px">' + esc(m.when || "") + '</div>' +
        '<div class="clip" style="font-size:25px;font-weight:500;color:#333">' + esc(m.subject) + '</div>' +
'</div>';
    }
    $("mail").innerHTML = h || '<div class="muted" style="font-size:28px">Nothing important. Inbox is quiet.</div>';
    $("mailR").innerHTML = (n ? "top " + n + "  " : "") + "›";
  }

  function drawFoot() {
    var s = "Updated " + hm(new Date());
    if (data.generated) s += " · Claude checked in " + data.generated;
    if (pending.length) s += " · " + pending.length + " waiting for Claude";
    if (!cfg.api) s += " · demo mode";
    $("foot").innerHTML = esc(s);
  }

  function drawAll() { prune(); drawToday(); drawSched(); drawTodo(); drawMail(); drawFoot(); if (open) openBox(open); }

  // ---------- detail windows ----------
  var BOXES = {
    today: { title: "Today's weather" },
    sched: { title: "Schedule", list: "schedule", acts: [["clear", "Clear it"], ["important", "★ Important"]] },
    todo: { title: "To-do & homework", list: "todos", acts: [["done", "✓ Done"], ["important", "★ Priority"], ["forget", "Forget"]] },
    mail: { title: "Important email", list: "emails", acts: [["respond", "Respond"], ["important", "★ Important"], ["forget", "Forget"]] }
  };

  function itemHtml(name, it, idx) {
    var b = BOXES[name], p = pendFor(it.id), h = '<div class="item' + (p.done || p.clear || p.forget ? " done" : "") + '">';
    if (name === "mail") {
      h += '<div class="ttl">' + esc(it.from) + ' <span class="muted" style="font-weight:400;font-size:24px">· ' + esc(it.when || "") + '</span></div>' +
        '<div class="sub" style="color:#000;font-weight:500;font-size:28px">' + esc(it.subject) + '</div>' +
        (it.snippet ? '<div class="snip">' + esc(it.snippet) + '</div>' : "") + (it.why ? '<div class="sub">Why it matters: ' + esc(it.why) + '</div>' : "");
    } else if (name === "todo") {
      h += todoRow(it, p) + (it.detail ? '<div class="snip">' + esc(it.detail) + '</div>' : "");
    } else {
      h += '<div style="position:relative;min-height:56px">' + schedRow(it, true) + '</div>';
    }
    h += '<div class="acts">';
    for (var i = 0; i < b.acts.length; i++)
      h += '<span class="btn' + (p[b.acts[i][0]] ? " on" : "") + '" data-a="' + b.acts[i][0] + '" data-i="' + idx + '">' + b.acts[i][1] + '</span>';
    h += '<span class="btn" data-a="note" data-i="' + idx + '">Note for Claude</span></div>';
    h += '<div class="inrow" id="in' + idx + '"><input type="text" id="tx' + idx + '"> <span class="btn on" data-a="send" data-i="' + idx + '">Send</span></div>';
    if (p.respond) h += '<div class="note">Reply queued: “' + esc(p.respond.text) + '”</div>';
    if (p.note) h += '<div class="note">Note: “' + esc(p.note.text) + '”</div>';
    if (p.done || p.clear || p.forget || p.important) h += '<div class="note">Claude will take care of this at the next check-in. Tap again to undo.</div>';
    return h + "</div>";
  }

  var inputMode = {};
  function openBox(name) {
    open = name; var b = BOXES[name], h = "", items, i;
    $("dtitle").innerHTML = esc(b.title);
    if (name === "today") {
      h = '<div style="font-size:30px;line-height:1.5">' + todayDetail() + '</div>';
    } else {
      items = data[b.list] || [];
      for (i = 0; i < items.length; i++) h += itemHtml(name, items[i], i);
      if (!items.length) h = '<div class="muted" style="font-size:30px">Nothing here right now.</div>';
    }
    $("dlist").innerHTML = h; $("detail").style.display = "block";
    var btns = $("dlist").getElementsByTagName("span");
    for (i = 0; i < btns.length; i++) if (btns[i].getAttribute("data-a")) tap(btns[i], onBtn);
  }

  function onBtn(e) {
    var el = e.target || e.srcElement; while (el && !el.getAttribute("data-a")) el = el.parentNode;
    var a = el.getAttribute("data-a"), idx = +el.getAttribute("data-i"), b = BOXES[open], it = (data[b.list] || [])[idx];
    if (a === "respond" || a === "note") {
      inputMode[idx] = a; $("in" + idx).style.display = "block";
      var inp = $("tx" + idx); inp.placeholder = a === "respond" ? "Type your reply (Claude sends it)…" : "Tell Claude what to do with this…"; inp.focus();
      return;
    }
    if (a === "send") {
      var txt = $("tx" + idx).value; if (!txt) return;
      act(open, it, inputMode[idx] || "note", txt);
      toast(inputMode[idx] === "respond" ? "Reply queued for Claude" : "Note sent to Claude");
    } else {
      toast(act(open, it, a) ? "Got it. Claude will handle it next check-in." : "Undone");
    }
    drawAll();
  }

  function todayDetail() {
    var w = weather; if (!w || !w.daily) return "Weather is still loading.";
    var d = w.daily, h = "<b>Next 3 days</b><br>", i;
    for (i = 1; i < d.time.length; i++) {
      var dt = new Date(d.time[i].replace(/-/g, "/"));
      h += '<div style="margin:6px 0">' + wIcon(d.weather_code[i], 40) + ' <b style="display:inline-block;width:180px">' + DAYS[dt.getDay()] + "</b>" +
        (WMO[d.weather_code[i]] || "") + " · " + r(d.temperature_2m_max[i]) + "° / " + r(d.temperature_2m_min[i]) + "° · rain " + (d.precipitation_probability_max[i] || 0) + "%</div>";
    }
    h += "<br><b>Hour by hour</b><br>";
    var hr = w.hourly, now = new Date().getTime() - 3600000, n = 0;
    for (i = 0; i < hr.time.length && n < 12; i++) {
      if (new Date(hr.time[i].replace("T", " ").replace(/-/g, "/")).getTime() < now) continue;
      h += '<span style="display:inline-block;width:240px">' + t12(hr.time[i]) + " · " + r(hr.temperature_2m[i]) + "° · " + (hr.precipitation_probability[i] || 0) + "%</span>"; n++;
    }
    return h;
  }

  // ---------- loading ----------
  function loadWeather() {
    var u = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
      "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m" +
      "&hourly=temperature_2m,weather_code,precipitation_probability" +
      "&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max,sunrise,sunset" +
      "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FLos_Angeles&forecast_days=4";
    xhr("GET", u, null, function (err, w) { if (!err) { weather = w; store("dash_weather", w); } drawAll(); });
  }
  function loadData() {
    if (!cfg.api) { drawAll(); return; }
    xhr("GET", cfg.api + "?key=" + encodeURIComponent(cfg.key || "") + "&op=data&t=" + new Date().getTime(), null, function (err, d) {
      if (!err && d && d.error === "bad code") { try { localStorage.removeItem("dash_key"); } catch (e) {} cfg.key = null; needLogin(); return; }
      if (!err && d && !d.error) { data = d; store("dash_data", d); }
      drawAll();
    });
  }
  function refresh() { loadWeather(); loadData(); resend(); }

  tap($("b-today"), function () { openBox("today"); });
  tap($("b-sched"), function () { openBox("sched"); });
  tap($("b-todo"), function () { openBox("todo"); });
  tap($("b-mail"), function () { openBox("mail"); });
  tap($("dclose"), function () { open = null; $("detail").style.display = "none"; inputMode = {}; drawAll(); });
  tap($("dsend"), function () {
    var v = $("dnote").value; if (!v) return;
    act(open, null, "note", v); $("dnote").value = ""; toast("Note sent to Claude"); drawAll();
  });
  window.onresize = fit;
  function needLogin() {
    $("login").style.display = "block";
    tap($("go"), function () {
      var k = ($("code").value || "").replace(/\s/g, "").toLowerCase(); if (!k) return;
      $("loginmsg").innerHTML = "Checking…";
      xhr("GET", cfg.api + "?op=ping&key=" + encodeURIComponent(k), null, function (err, d) {
        if (err || !d || !d.ok) { $("loginmsg").innerHTML = "That code didn't work. Check it and try again."; return; }
        cfg.key = k; try { localStorage.setItem("dash_key", k); } catch (e) {}
        $("login").style.display = "none"; refresh();
      });
    });
  }
  fit(); drawAll();
  if (cfg.api && !cfg.key) needLogin(); else refresh();
  setInterval(function () { if (!open) refresh(); else loadWeather(); }, REFRESH_MS);
  setInterval(function () { if (!open) drawToday(); drawFoot(); }, 60000);
